<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* 작은 창에 미리 넣은 스타일은 이것뿐입니다. 나머지는 브라우저 기본 스타일입니다. */
  :root { color-scheme: light; }
  body {
    margin: 12px 16px;
    background: #fff;
    color: #111;
    font-family: system-ui, sans-serif;
    line-height: 1.6;
  }
  :target { outline: 3px solid #f59e0b; outline-offset: 3px; }
</style>
<script>
  /*
   * 블로그의 '직접 해 보기'가 이 문서를 작은 창으로 씁니다.
   * 바깥 블록이 iframe 요소에 실어 둔 코드를 읽어, 문서를 읽는 도중에 그대로 써 넣습니다.
   * 그래서 코드 안의 <script>도 보통 페이지처럼 돕니다.
   * 블로그 밖에서 이 주소를 직접 열면 frameElement가 null이라 아무 코드도 넣지 않습니다.
   */
  window.__labPlay = true;

  /* 도우미: 지금 값 칸이 부르는 함수들입니다. */
  window.labDom = (root = document.body) => {
    const out = [];
    const walk = (node, depth) => {
      for (const child of node.childNodes) {
        if (child.nodeType === 1) {
          const attrs = [...child.attributes]
            .map((a) => (a.value === '' ? ` ${a.name}` : ` ${a.name}="${a.value}"`))
            .join('');
          out.push(`${'  '.repeat(depth)}<${child.localName}${attrs}>`);
          walk(child.localName === 'template' ? child.content : child, depth + 1);
        } else if (child.nodeType === 3 && child.data.trim()) {
          const raw = ['script', 'style'].includes(node.localName) ? '…' : child.data;
          out.push(`${'  '.repeat(depth)}"${raw.replace(/\s+/g, ' ').trim()}"`);
        }
      }
    };
    walk(root, 0);
    return out.join('\n') || '(비어 있음)';
  };

  window.labOutline = () => {
    let prev = 0;
    const lines = [...document.querySelectorAll('h1, h2, h3, h4, h5, h6')].map((h) => {
      const level = Number(h.localName[1]);
      const skip = prev && level > prev + 1 ? `   ← h${prev} 다음에 바로 h${level}` : '';
      prev = level;
      return `${'  '.repeat(level - 1)}${h.localName} ${h.textContent.trim()}${skip}`;
    });
    return lines.join('\n') || '(제목 없음)';
  };

  /* HTML-AAM의 규칙으로 랜드마크 역할을 셉니다. 개발자 도구의 Accessibility 탭과 같은 값입니다. */
  window.labLandmarks = () => {
    const SECTIONING = 'article, aside, main, nav, section';
    const nameOf = (el) => {
      const ref = el.getAttribute('aria-labelledby');
      const byRef = ref && document.getElementById(ref)?.textContent.trim();
      return el.getAttribute('aria-label') || byRef || el.getAttribute('title') || '';
    };
    const roleOf = (el) => {
      const explicit = el.getAttribute('role');
      if (explicit) return explicit;
      const scoped = el.parentElement?.closest(SECTIONING);
      switch (el.localName) {
        case 'header': return scoped ? null : 'banner';
        case 'footer': return scoped ? null : 'contentinfo';
        case 'nav': return 'navigation';
        case 'main': return 'main';
        case 'search': return 'search';
        /* aside는 main 안이어도 complementary다. article, aside, nav, section 안에서만 이름이 있어야 한다 */
        case 'aside':
          return el.parentElement?.closest('article, aside, nav, section') && !nameOf(el)
            ? null
            : 'complementary';
        case 'section': return nameOf(el) ? 'region' : null;
        case 'form': return nameOf(el) ? 'form' : null;
        default: return null;
      }
    };
    const found = [];
    const walk = (node, depth) => {
      for (const el of node.children) {
        const role = roleOf(el);
        if (role) {
          const name = nameOf(el);
          found.push(`${'  '.repeat(depth)}${role}  <${el.localName}>${name ? `  "${name}"` : ''}`);
        }
        walk(el, role ? depth + 1 : depth);
      }
    };
    walk(document.body, 0);
    return found.join('\n') || '(랜드마크 없음)';
  };

  (() => {
    const lab = window.frameElement && window.frameElement.lab;
    if (!lab) {
      document.write('<p>이 파일은 블로그의 직접 해 보기 블록 안에서 쓰입니다.</p>');
      return;
    }
    lab.early(window);
    document.write(lab.code);
  })();
</script>
